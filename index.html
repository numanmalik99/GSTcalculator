<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Calculator</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <h2>GST Calculator</h2>
        <div class="input-group">
            <label for="amount">Enter Amount ($):</label>
            <input type="number" id="amount" placeholder="e.g., 1000" step="0.01">
        </div>


        <div class="input-group">
            <label for="gstRate">GST Rate (%):</label>
            <input type="number" id="gstRate" placeholder="e.g., 18" step="0.01">
        </div>

        <button onclick="calculateGST()">Calculate</button>

        <div id="resultSection" class="result-section hidden">
            <h3>Calculated Results</h3>
            <div class="result-group">
                <h4>Add GST</h4>
                <p><strong>Value Before GST:</strong> <span id="beforeGST">$0.00</span></p>
                <p><strong>Calculated GST:</strong> <span id="addGSTAmount">$0.00</span></p>
                <p><strong>GST Inclusive Value:</strong> <span id="inclusiveValue">$0.00</span></p>
            </div>


            <div>
                <h4>Subtract GST</h4>
                <p><strong>Value Including GST:</strong> <span id="valueWithGST">$0.00</span></p>
                <p><strong>Subtracted GST:</strong> <span id="subtractGSTAmount">$0.00</span></p>
                <p><strong>GST Exclusive Value:</strong> <span id="exclusiveValue">$0.00</span></p>
            </div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
